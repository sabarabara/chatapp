plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.postgresql:postgresql:42.6.0'
	implementation 'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64' // Mac M1/M2用
	implementation 'org.springframework.boot:spring-boot-starter-data-redis' // Redis追加
    implementation 'org.springframework.session:spring-session-data-redis'    // Spring Session用
}

tasks.named('test') {
	useJUnitPlatform()
}
