version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"        # ダッシュボード有効化（本番では外部公開しないこと）
      - "--providers.docker=true"       # Dockerラベルから自動設定
      - "--providers.docker.network=app-net" # Traefikが接続するネットワーク
      - "--providers.docker.exposedByDefault=false" # 明示的に有効化されたサービスのみを公開
      - "--entrypoints.web.address=:80" # HTTPエントリーポイント


    ports:
      - "80:80"     # HTTPトラフィック
      - "8082:8080"   # Traefikダッシュボード
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - app-net

  redis:
    image: redis:7
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-session:
    image: redis:7
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-rag:
    image: postgres:15
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      POSTGRES_DB: rag_db
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-java:
    image: postgres:15
    environment:
      POSTGRES_USER: java_user
      POSTGRES_PASSWORD: java_pass
      POSTGRES_DB: java_db
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U java_user -d java_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  go-ws:
    build:
      context: ./go-ws
      dockerfile: docker/Dockerfile
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      postgres-rag:
        condition: service_healthy
      postgres-java:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - JAVA_API_HOST=java-api
      - JAVA_API_PORT=8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.go-ws.rule=Host(`localhost`) && PathPrefix(`/go`)"
      - "traefik.http.services.go-ws.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.go-ws-stripprefix.stripprefix.prefixes=/go"
      - "traefik.http.routers.go-ws.middlewares=go-ws-stripprefix"
      # WebSocketサポートを明示的に有効化
      - "traefik.http.services.go-ws.loadbalancer.passhostheader=true"

  java-api:
    build: ./java-api/myproject
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres-java:
        condition: service_healthy
      postgres-rag:
        condition: service_healthy
    environment:
      - CPP_WORKER_HOST=cpp-worker:8080
      - PYTHON_RAG_HOST=python-rag:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      - JAVA=java/

      #ここは後で直す
      #- POSTGRES_URL=jdbc:postgresql://postgres-java:5432/java_db
      #- POSTGRES_USER=java_user
      #- POSTGRES_PASSWORD=java_pass
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.java-api.entrypoints=web"
      - "traefik.http.routers.java-api.rule=Host(`localhost`) && PathPrefix(`/java`)"
      - "traefik.http.services.java-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.java-api-stripprefix.stripprefix.prefixes=/java"
      - "traefik.http.middlewares.java-api-headers.headers.customrequestheaders.X-Forwarded-Prefix=/java"
      - "traefik.http.routers.java-api.middlewares=java-api-stripprefix,java-api-headers"



  cpp-worker:
    build:
      context: ./cpp-worker
      dockerfile: Dockerfile
    networks:
      - app-net
    stdin_open: true
    tty: true
    depends_on:
      redis:
        condition: service_healthy
      postgres-rag:
        condition: service_healthy
      postgres-java:
        condition: service_healthy
      

  python-rag:
    build:
      context: ./python-rag
      dockerfile: Dockerfile
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      postgres-rag:
        condition: service_healthy
      postgres-java:
        condition: service_healthy


  ts-seeder:
    build:
      context: ./ts-seeder
      dockerfile: Dockerfile
    networks:
      - app-net
    depends_on:
      postgres-rag:
        condition: service_healthy
      postgres-java:
        condition: service_healthy
      java-api:
        condition: service_healthy

networks:
  app-net:
    driver: bridge
